[package]
name = "there-is-always-a-reason"
authors = ["Rafael Bachmann <rafael.bachmann.93@gmail.com>"]

version = "0.1.0"

edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
deutsche-bahn-delay-reasons = "1.2"
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }

[package.metadata.cargo-shear]
ignored = ["getrandom"]

[profile.release]
lto = true
opt-level = 's'
